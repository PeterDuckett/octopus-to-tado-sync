name: Run Tado-Octopus Script

on:
  workflow_dispatch:
  schedule:
    # Runs every day at 06:17 UTC (off the hour to avoid GitHub's schedule backlog)
    - cron: '17 6 * * *'

jobs:
  run_script:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Initialise playwright
      env:
        # Playwright has no Ubuntu 26.04 builds yet; use the 24.04 ones
        PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
      run: |
        playwright install chromium

    - name: Run Python script
      env:
        PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
      run: |
        python sync_octopus_tado.py \
          --tado-email "${{ secrets.TADO_EMAIL }}" \
          --tado-password "${{ secrets.TADO_PASSWORD }}" \
          --mprn "${{ secrets.OCTOPUS_MPRN }}" \
          --gas-serial-number "${{ secrets.OCTOPUS_GAS_SERIAL }}" \
          --octopus-api-key "${{ secrets.OCTOPUS_API_KEY }}"
