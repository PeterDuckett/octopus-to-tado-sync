name: Run Tado-Octopus Script

on:
  workflow_dispatch:
  schedule:
    # Runs every day at 2am UTC
    - cron: '0 2 * * *'

permissions:
  contents: read
  actions: write

jobs:
  run_script:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Initialise playwright
      run: |
        playwright install

    - name: Run Python script
      run: |
        python sync_octopus_tado.py \
          --tado-email "${{ secrets.TADO_EMAIL }}" \
          --tado-password "${{ secrets.TADO_PASSWORD }}" \
          --mprn "${{ secrets.OCTOPUS_MPRN }}" \
          --gas-serial-number "${{ secrets.OCTOPUS_GAS_SERIAL }}" \
          --octopus-api-key "${{ secrets.OCTOPUS_API_KEY }}"

  # GitHub disables scheduled workflows in public repos after 60 days without
  # repository activity. Re-enabling the workflow through the API resets that
  # timer, so the daily sync keeps running without needing dummy commits.
  keepalive:
    runs-on: ubuntu-latest
    steps:
    - name: Keep scheduled workflow enabled
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api --method PUT \
          "repos/${{ github.repository }}/actions/workflows/schedule_sync.yml/enable"
